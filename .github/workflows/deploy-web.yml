name: Deploy web app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Test and deploy web app
    if: github.event_name == 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve app version
        id: app_version
        run: echo "version=$(git describe --tags --abbrev=0 --match 'v[0-9]*')" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Test Cloudflare Worker
        working-directory: cloudflare/opensky-proxy
        run: npm test

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Analyze Flutter code
        run: flutter analyze lib test integration_test

      - name: Test Flutter code
        run: flutter test

      - name: Build Android debug APK
        run: flutter build apk --debug

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: cloudflare/opensky-proxy
          command: deploy

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build Flutter Web
        env:
          APP_VERSION: ${{ steps.app_version.outputs.version }}
          WEB_API_PROXY_URL: ${{ vars.WEB_API_PROXY_URL || 'https://skyoverhead-api-proxy.kruskakli.workers.dev' }}
        run: >-
          flutter build web --release
          --base-href "/${{ github.event.repository.name }}/"
          --dart-define=APP_VERSION=${APP_VERSION}
          --dart-define=WEB_API_PROXY_BASE_URL=${WEB_API_PROXY_URL}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/web

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
