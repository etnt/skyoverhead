<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Sky background -->
  <rect width="1024" height="1024" fill="#3B4AC0"/>
  <rect width="1024" height="1024" fill="#2E3A9E" opacity="0"/>

  <!-- Soft glow behind the aircraft -->
  <circle cx="512" cy="520" r="380" fill="#FFFFFF" opacity="0.06"/>
  <circle cx="512" cy="520" r="270" fill="#FFFFFF" opacity="0.06"/>

  <!-- Radar sweep arcs (looking straight up) -->
  <g fill="none" stroke="#FFFFFF" stroke-linecap="round">
    <circle cx="512" cy="520" r="180" opacity="0.16" stroke-width="10"/>
    <circle cx="512" cy="520" r="300" opacity="0.12" stroke-width="10"/>
    <circle cx="512" cy="520" r="420" opacity="0.08" stroke-width="10"/>
  </g>

  <!-- Aircraft directly overhead (Material "flight" glyph, scaled + centered) -->
  <g transform="translate(167,158) scale(30)">
    <path d="M21 16v-2l-8-5V3.5c0-.83-.67-1.5-1.5-1.5S10 2.67 10 3.5V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5l8 2.5z"
          fill="#F3D27A"/>
  </g>
</svg>
